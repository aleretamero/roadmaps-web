components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: .Roadmaps.Session
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Sem sessão
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Não encontrado (ou de outro usuário)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 'Conflito (ex.: drive_not_connected, dependency_cycle, data repetida)'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PreconditionFailed:
      description: Versão desatualizada (edit_conflict)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          description: Código estável para o front decidir a mensagem
          enum:
            - validation_error
            - not_found
            - unauthorized
            - edit_conflict
            - dependency_cycle
            - invalid_stage
            - drive_not_connected
            - conflict
            - internal_error
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Erros por campo (validação e dry run da importação)
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - code
    Stage:
      type: string
      enum:
        - planned
        - studying
        - practicing
        - completed
    SessionAction:
      type: string
      description: O que foi feito numa sessão (estudei, pratiquei, concluí).
      enum:
        - studied
        - practiced
        - completed
    StageCounts:
      type: object
      description: Tópicos que contam no progresso, por etapa.
      properties:
        planned:
          type: integer
        studying:
          type: integer
        practicing:
          type: integer
        completed:
          type: integer
      required:
        - planned
        - studying
        - practicing
        - completed
    ModuleKind:
      type: string
      enum:
        - required
        - optional
        - alternative
    ModuleStatus:
      type: string
      enum:
        - notStarted
        - inProgress
        - completed
    Weekday:
      type: string
      enum:
        - sunday
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
    Progress:
      type: object
      properties:
        completed:
          type: integer
          description: Tópicos obrigatórios concluídos
        total:
          type: integer
          description: Tópicos obrigatórios
        percent:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - completed
        - total
        - percent
    StageTotals:
      type: object
      properties:
        planned:
          type: integer
        studying:
          type: integer
        practicing:
          type: integer
        completed:
          type: integer
      required:
        - planned
        - studying
        - practicing
        - completed
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
        timeZone:
          type: string
          example: America/Sao_Paulo
      required:
        - id
        - name
        - email
        - avatarUrl
        - timeZone
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        timeZone:
          type: string
      required: []
    Preferences:
      type: object
      properties:
        studyDays:
          type: array
          items:
            $ref: '#/components/schemas/Weekday'
        includeOptional: *id004
        homePage:
          type: string
          enum:
            - dashboard
            - roadmaps
            - schedule
        reminderEnabled: *id004
        reminderTime:
          type: string
          pattern: ^\d{2}:\d{2}$
          example: '20:00'
      required:
        - studyDays
        - includeOptional
        - homePage
        - reminderEnabled
        - reminderTime
    TopicRef:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        moduleId:
          type: integer
        moduleTitle:
          type: string
        roadmapId:
          type: integer
        roadmapName:
          type: string
      required:
        - id
        - title
        - moduleId
        - moduleTitle
        - roadmapId
        - roadmapName
    TopicSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        isOptional: *id004
        stage:
          $ref: '#/components/schemas/Stage'
        position:
          type: integer
        startedOn:
          anyOf:
            - *id011
            - type: 'null'
        completedOn:
          anyOf:
            - *id011
            - type: 'null'
        dueDate:
          anyOf:
            - *id011
            - type: 'null'
        isLate: *id004
        filesCount:
          type: integer
      required:
        - id
        - title
        - isOptional
        - stage
        - position
        - startedOn
        - completedOn
        - dueDate
        - isLate
        - filesCount
    TopicDetail:
      allOf:
        - $ref: '#/components/schemas/TopicSummary'
        - type: object
          properties:
            description:
              anyOf:
                - type: string
                - type: 'null'
            moduleId:
              type: integer
            moduleTitle:
              type: string
            roadmapId:
              type: integer
            roadmapName:
              type: string
            scheduleEntries:
              type: array
              items:
                $ref: '#/components/schemas/ScheduleEntry'
            counts:
              type: object
              properties:
                sessions:
                  type: integer
                notes:
                  type: integer
                resources:
                  type: integer
                files:
                  type: integer
              required:
                - sessions
                - notes
                - resources
                - files
            createdAt: &id013
              type: string
              format: date-time
            updatedAt: *id013
          required:
            - description
            - moduleId
            - moduleTitle
            - roadmapId
            - roadmapName
            - scheduleEntries
            - counts
            - createdAt
            - updatedAt
    ModuleNode:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          anyOf:
            - type: string
            - type: 'null'
        kind:
          $ref: '#/components/schemas/ModuleKind'
        position:
          type: integer
        dependsOn:
          type: array
          items:
            type: integer
        startedOn:
          anyOf:
            - *id011
            - type: 'null'
        status:
          $ref: '#/components/schemas/ModuleStatus'
        progress:
          $ref: '#/components/schemas/Progress'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicSummary'
      required:
        - id
        - title
        - description
        - kind
        - position
        - dependsOn
        - startedOn
        - status
        - progress
        - topics
    ModuleDetail:
      allOf:
        - $ref: '#/components/schemas/ModuleNode'
        - type: object
          properties:
            roadmapId:
              type: integer
            roadmapName:
              type: string
            createdAt: *id013
            updatedAt: *id013
          required:
            - roadmapId
            - roadmapName
            - createdAt
            - updatedAt
    PathChoice:
      type: object
      properties:
        branchModuleId:
          type: integer
        chosenModuleId:
          type: integer
      required:
        - branchModuleId
        - chosenModuleId
    RoadmapSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        goal:
          anyOf:
            - type: string
            - type: 'null'
        archivedAt:
          anyOf:
            - *id013
            - type: 'null'
        progress:
          $ref: '#/components/schemas/Progress'
        nextTopic:
          anyOf:
            - $ref: '#/components/schemas/TopicRef'
            - type: 'null'
        modulesCount:
          type: integer
        topicsCount:
          type: integer
        startedOn:
          anyOf:
            - *id011
            - type: 'null'
        updatedAt: *id013
        stageCounts:
          $ref: '#/components/schemas/StageCounts'
        currentModules:
          type: array
          description: Módulos começados e ainda não concluídos, na ordem do roadmap.
          items:
            type: string
        nextTopicDate:
          description: Próxima data agendada do próximo tópico (null sem agendamento).
          anyOf:
            - *id011
            - type: 'null'
      required:
        - id
        - name
        - goal
        - archivedAt
        - progress
        - nextTopic
        - modulesCount
        - topicsCount
        - startedOn
        - updatedAt
        - stageCounts
        - currentModules
        - nextTopicDate
    RoadmapDetail:
      type: object
      properties:
        id:
          type: integer
        name:
