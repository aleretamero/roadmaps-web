openapi: 3.1.0
info:
  title: Roadmaps API
  version: 1.0.0
  description:
    Contrato v1 da API do Gestor pessoal de roadmaps e conhecimento. Gerado por contracts/build-openapi.py a partir
    do planejamento (https://claude.ai/artifact/NyCNWDSjbLTa2Ea6B3MJTy).
servers:
  - url: /api/v1
security:
  - cookie: []
paths:
  /auth/login/{provider}:
    get:
      tags:
        - Autenticação
      operationId: login
      summary: Inicia o OAuth e redireciona para o provedor
      responses:
        '302':
          description: Redireciona para o provedor
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '404': &id003
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - github
              - google
        - name: redirect
          in: query
          required: false
          schema:
            type: string
      security: []
  /auth/callback/{provider}:
    get:
      tags:
        - Autenticação
      operationId: authCallback
      summary: 'Retorno do OAuth: cria a conta no primeiro acesso e grava o cookie'
      responses:
        '302':
          description: Volta para o app
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - github
              - google
      security: []
  /auth/logout:
    post:
      tags:
        - Autenticação
      operationId: logout
      summary: Encerra a sessão
      responses:
        '204': &id005
          description: Sem conteúdo
        '400': *id001
        '401': *id002
        '404': *id003
  /me:
    get:
      tags:
        - Conta
      operationId: getMe
      summary: Usuário logado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id002
        '404': *id003
    patch:
      tags:
        - Conta
      operationId: updateMe
      summary: Muda nome e fuso
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
  /me/preferences:
    get:
      tags:
        - Conta
      operationId: getPreferences
      summary: Preferências de estudo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400': *id001
        '401': *id002
        '404': *id003
    put:
      tags:
        - Conta
      operationId: updatePreferences
      summary: Salva as preferências de estudo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Preferences'
  /dashboard:
    get:
      tags:
        - Painel
      operationId: getDashboard
      summary: Hoje, semana, sequência, números, próximos 7 dias e atenção
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400': *id001
        '401': *id002
        '404': *id003
  /dashboard/activity:
    get:
      tags:
        - Painel
      operationId: getActivity
      summary: Mapa de calor e totais
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: weeks
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 24
  /search:
    get:
      tags:
        - Busca
      operationId: search
      summary: Busca em tópicos, anotações e arquivos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Aceita "frase exata", prefixo* e -excluir
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - topics
              - notes
              - files
        - &id006
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - &id007
          name: cursor
          in: query
          required: false
          schema:
            type: string
  /roadmaps:
    get:
      tags:
        - Roadmaps
      operationId: listRoadmaps
      summary: Roadmaps com progresso e próximo tópico
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoadmapSummary'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: archived
          in: query
          required: false
          schema: &id004
            type: boolean
    post:
      tags:
        - Roadmaps
      operationId: createRoadmap
      summary: Cria um roadmap (vazio ou com módulos e tópicos)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapDetail'
          headers:
            Location:
              schema:
                type: string
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoadmapRequest'
  /roadmaps/import:
    post:
      tags:
        - Importação
      operationId: importRoadmap
      summary: Cria um roadmap a partir do JSON
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
          headers:
            Location:
              schema:
                type: string
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRoadmapRequest'
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: *id004
  /roadmaps/{id}:
    get:
      tags:
        - Roadmaps
      operationId: getRoadmap
      summary: 'Roadmap completo: módulos, dependências, escolhas e tópicos'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapDetail'
          headers: &id008
            ETag:
              schema:
                type: string
              description: Versão do recurso (RowVersion); mande em If-Match no PATCH
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    patch:
      tags:
        - Roadmaps
      operationId: updateRoadmap
      summary: Muda nome e objetivo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapDetail'
        '400': *id001
        '401': *id002
        '404': *id003
        '412': &id009
          $ref: '#/components/responses/PreconditionFailed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoadmapRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - &id010
          name: If-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag recebido no GET; versão velha responde 412
    delete:
      tags:
        - Roadmaps
      operationId: deleteRoadmap
      summary: Apaga o roadmap
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/archive:
    post:
      tags:
        - Roadmaps
      operationId: archiveRoadmap
      summary: Arquiva
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/unarchive:
    post:
      tags:
        - Roadmaps
      operationId: unarchiveRoadmap
      summary: Devolve aos ativos
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/progress:
    get:
      tags:
        - Roadmaps
      operationId: getRoadmapProgress
      summary: Aba Progresso
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadmapProgress'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/path-choices/{branchModuleId}:
    put:
      tags:
        - Roadmaps
      operationId: choosePath
      summary: Escolhe o caminho depois de um ponto de divisão
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathChoice'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePathRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: branchModuleId
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/modules/order:
    put:
      tags:
        - Módulos
      operationId: reorderModules
      summary: Nova ordem dos módulos
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/changelog:
    get:
      tags:
        - Histórico
      operationId: getRoadmapChangelog
      summary: Alterações do roadmap
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeLogPage'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id006
        - *id007
  /roadmaps/{id}/import:
    post:
      tags:
        - Importação
      operationId: importModules
      summary: Encaixa módulos num roadmap existente (after / alternativeTo)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400': *id001
        '401': *id002
        '404': *id003
        '422':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportModulesRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dryRun
          in: query
          required: false
          schema: *id004
  /roadmaps/{id}/schedule/preview:
    post:
      tags:
        - Agenda
      operationId: previewSchedule
      summary: Calcula o agendamento automático sem gravar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePreview'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePreviewRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/schedule:
    post:
      tags:
        - Agenda
      operationId: applySchedule
      summary: Grava o agendamento automático
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePreview'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchedulePreviewRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /roadmaps/{id}/modules:
    post:
      tags:
        - Módulos
      operationId: createModule
      summary: Cria um módulo
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
          headers:
            Location:
              schema:
                type: string
        '400': *id001
        '401': *id002
        '404': *id003
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModuleRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /modules/{id}:
    get:
      tags:
        - Módulos
      operationId: getModule
      summary: Detalhe do módulo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
          headers: *id008
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    patch:
      tags:
        - Módulos
      operationId: updateModule
      summary: Edita o módulo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetail'
        '400': *id001
        '401': *id002
        '404': *id003
        '412': *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModuleRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id010
    delete:
      tags:
        - Módulos
      operationId: deleteModule
      summary: Apaga o módulo e os tópicos
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /modules/{id}/dependencies:
    put:
      tags:
        - Módulos
      operationId: setModuleDependencies
      summary: Substitui a lista de "depois de"
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
        '409': &id012
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /modules/{id}/timeline:
    get:
      tags:
        - Histórico
      operationId: getModuleTimeline
      summary: Progresso nos tópicos e alterações do módulo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - progress
              - changes
        - *id006
        - *id007
  /modules/{id}/notes:
    get:
      tags:
        - Anotações
      operationId: listModuleNotes
      summary: Anotações do módulo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    post:
      tags:
        - Anotações
      operationId: createModuleNote
      summary: Cria anotação no módulo
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          headers:
            Location:
              schema:
                type: string
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /modules/{id}/topics:
    post:
      tags:
        - Tópicos
      operationId: createTopics
      summary: Cria um ou vários tópicos no fim do módulo
      responses:
        '201':
          description: Criados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicSummary'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicsRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /modules/{id}/topics/order:
    put:
      tags:
        - Tópicos
      operationId: reorderTopics
      summary: Nova ordem dos tópicos
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdList'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /topics/{id}:
    get:
      tags:
        - Tópicos
      operationId: getTopic
      summary: Detalhe do tópico
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
          headers: *id008
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    patch:
      tags:
        - Tópicos
      operationId: updateTopic
      summary: Edita o tópico
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '400': *id001
        '401': *id002
        '404': *id003
        '412': *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - *id010
    delete:
      tags:
        - Tópicos
      operationId: deleteTopic
      summary: Apaga o tópico
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /topics/{id}/move:
    post:
      tags:
        - Tópicos
      operationId: moveTopic
      summary: Leva o tópico para outro módulo
      responses:
        '204': *id005
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTopicRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /topics/{id}/reopen:
    post:
      tags:
        - Tópicos
      operationId: reopenTopic
      summary: Volta a etapa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDetail'
        '400': *id001
        '401': *id002
        '404': *id003
        '422':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenTopicRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /topics/{id}/timeline:
    get:
      tags:
        - Histórico
      operationId: getTopicTimeline
      summary: O que você fez e histórico de alterações
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '400': *id001
        '401': *id002
        '404': *id003
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - sessions
              - changes
        - *id006
        - *id007
  /topics/{id}/sessions:
    post:
      tags:
        - Sessões
      operationId: registerSession
      summary: Registra uma sessão e devolve a etapa nova
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
        '400': *id001
        '401': *id002
        '404': *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterSessionRequest'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
  /sessions:
    get:
      tags:
        - Sessões
      operationId: listSessions
      summary: Sessões de um período
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionWithTopic'
        '400': *id001
        '401': *id002
