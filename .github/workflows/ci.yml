name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contrato da API
        run: pnpm api:lint
      - name: Formatação, lint, cores, tipos e testes unitários
        run: pnpm check
      - name: Tipos gerados do contrato estão atualizados
        run: git diff --exit-code -- src/lib/api/schema.d.ts src/routeTree.gen.ts
      - name: Build
        run: pnpm build
      - name: Orçamento de bundle
        run: pnpm size

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Navegador do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Dependências do sistema do navegador
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Testes das stories (interação + acessibilidade)
        run: pnpm test:stories
      - name: Build do Storybook
        run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: storybook-static
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versão do Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Navegador do Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Dependências do sistema do navegador
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # As capturas aprovadas são geradas localmente; a fonte do runner pode
      # mudar alguns pixels, então no CI a regressão visual não bloqueia.
      - name: Testes E2E
        run: pnpm e2e --ignore-snapshots
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  report:
    name: Comentário no PR
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    needs: [check, storybook, e2e]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const r = (job) => ({ success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' })[job.result] ?? job.result
            const needs = ${{ toJSON(needs) }}
            const body = [
              '<!-- ci-report -->',
              '### CI',
              `| Etapa | Resultado |`,
              `| --- | --- |`,
              `| Lint, tipos e testes | ${r(needs.check)} |`,
              `| Storybook | ${r(needs.storybook)} |`,
              `| E2E (Playwright) | ${r(needs.e2e)} |`,
              '',
              `Relatório do Playwright e Storybook publicado: artefatos \`playwright-report\` e \`storybook\` em [esta execução](${run}).`,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number })
            const old = comments.find((c) => c.body?.includes('<!-- ci-report -->'))
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
